<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Prices</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0c1017;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background: linear-gradient(180deg, #0d1b2a 0%, #07111e 100%);
            border: 2px solid #d4af37;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 24px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: #ffffff;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            color: #e5ca72;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .date-str {
            font-size: 14px;
            color: #8da4c4;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        /* شريط التحديث والوقت */
        .update-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 16px;
            font-size: 12px;
            color: #8da4c4;
        }

        .refresh-btn {
            background: #d4af37;
            color: #0c1017;
            border: none;
            border-radius: 6px;
            padding: 5px 12px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .refresh-btn:active {
            transform: scale(0.95);
            background: #b89728;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 10px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .full-width {
            margin-bottom: 12px;
        }

        .label {
            font-size: 15px;
            color: #e5ca72;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .value {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }

        .divider {
            height: 1px;
            background: rgba(212, 175, 55, 0.3);
            margin: 16px 0 12px 0;
        }

        .sub-footer {
            font-size: 13px;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .author {
            font-size: 16px;
            color: #e5ca72;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-title">جروب عملاء البنوك المصرية</div>
        <div class="date-str" id="today-date">--</div>

        <!-- شريط التحديث اليدوي وزر التحديث ووقت آخر تحديث -->
        <div class="update-bar">
            <span id="last-update">آخر تحديث: --:--</span>
            <button class="refresh-btn" onclick="fetchPrices()">تحديث الآن ⟳</button>
        </div>

        <div class="grid-container">
            <div class="box">
                <div class="label">عيار 21</div>
                <div class="value" id="gold-21">جاري التحميل...</div>
            </div>
            <div class="box">
                <div class="label">عيار 24</div>
                <div class="value" id="gold-24">جاري التحميل...</div>
            </div>
            <div class="box">
                <div class="label">عيار 14</div>
                <div class="value" id="gold-14">جاري التحميل...</div>
            </div>
            <div class="box">
                <div class="label">عيار 18</div>
                <div class="value" id="gold-18">جاري التحميل...</div>
            </div>
        </div>

        <div class="box full-width">
            <div class="label">سعر الجنيه الذهب</div>
            <div class="value" id="gold-coin">جاري التحميل...</div>
        </div>

        <div class="box full-width">
            <div class="label">أوقية الذهب</div>
            <div class="value" id="gold-ounce">جاري التحميل...</div>
        </div>

        <div class="sub-footer">Follow Egyptian Bank Clients Group</div>
        <div class="divider"></div>
        <div class="author">إعداد أ/ طارق متولي</div>
    </div>

    <script>
        // إظهار التاريخ التلقائي
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        document.getElementById('today-date').innerText = `${dd}-${mm}-${yyyy}`;

        async function fetchPrices() {
            try {
                // إضافة timestamp لمنع الـ Caching تماماً وسحب النسخة الحية فوراً
                const timestamp = new Date().getTime();
                const csvUrl = `https://docs.google.com/spreadsheets/d/1jGuWDQQgfJmbmIMcG3b--20-IUCEVlFQjbMp0rxv3do/export?format=csv&id=1jGuWDQQgfJmbmIMcG3b--20-IUCEVlFQjbMp0rxv3do&gid=0&t=${timestamp}`;

                const response = await fetch(csvUrl, { cache: 'no-store' });
                const data = await response.text();
                
                const rows = data.split('\n').map(row => row.split(',').map(cell => cell.replace(/"/g, '').trim()));
                
                if (rows.length >= 6) {
                    if(rows[0][1]) document.getElementById('gold-24').innerText = `${rows[0][1]} جنيه`;
                    if(rows[1][1]) document.getElementById('gold-21').innerText = `${rows[1][1]} جنيه`;
                    if(rows[2][1]) document.getElementById('gold-18').innerText = `${rows[2][1]} جنيه`;
                    if(rows[3][1]) document.getElementById('gold-14').innerText = `${rows[3][1]} جنيه`;
                    if(rows[4][1]) document.getElementById('gold-coin').innerText = `${rows[4][1]} جنيه`;
                    if(rows[5][1]) document.getElementById('gold-ounce').innerText = `${rows[5][1]} جنيه`;
                }

                // تحديث وقت آخر عملية سحب ناجحة للأسعار
                const now = new Date();
                const timeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
                document.getElementById('last-update').innerText = `آخر تحديث: ${timeString}`;

            } catch (error) {
                console.error('خطأ في جلب البيانات:', error);
                document.getElementById('last-update').innerText = 'فشل التحديث، حاول مجدداً';
            }
        }

        // جلب البيانات فور فتح التطبيق
        fetchPrices();

        // تحديث أوتوماتيكي صامت في الخلفية كل دقيقة لضمان استقرار التطبيق
        setInterval(fetchPrices, 60000);
    </script>
</body>
</html>
