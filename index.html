
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Prices</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
}

body {
    background: #0c1017;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 8px;
}

.card {
    background: linear-gradient(180deg,#0d1b2a,#07111e);
    border: 2px solid #d4af37;
    border-radius: 16px;
    width: 100%;
    max-width: 420px;
    padding: 16px 17px;
    text-align: center;
    color: white;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
}

.header-title {
    font-size: 19px;
    font-weight: bold;
    color: #e5ca72;
    margin-bottom: 4px;
}

.date-str {
    font-size: 13px;
    color: #8da4c4;
    margin-bottom: 11px;
    letter-spacing: 1px;
}

.update-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(212,175,55,.2);
    border-radius: 8px;
    padding: 7px 9px;
    margin-bottom: 11px;
    font-size: 11px;
    color: #a8b9d0;
    gap: 5px;
}

.update-info {
    display: flex;
    align-items: center;
    gap: 5px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #d4af37;
    flex-shrink: 0;
}

.status-dot.online { background: #39c77a; }
.status-dot.offline { background: #e05252; }

.refresh-btn {
    background: #d4af37;
    color: #0c1017;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-weight: bold;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
}

.grid-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-bottom: 9px;
}

.box {
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(212,175,55,.25);
    border-radius: 10px;
    padding: 10px 7px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 78px;
}

.label {
    font-size: 14px;
    color: #e5ca72;
    margin-bottom: 4px;
    font-weight: 600;
}

.value {
    font-size: 19px;
    font-weight: bold;
    color: #fff;
    direction: rtl;
}

.currency {
    font-size: 14px;
    font-weight: 600;
    margin-right: 3px;
}

.full-width {
    margin-bottom: 9px;
    min-height: 76px;
}

.sub-footer {
    font-size: 12px;
    color: white;
    font-weight: 600;
    margin: 9px 0;
    letter-spacing: .3px;
}

.divider {
    height: 1px;
    background: rgba(212,175,55,.3);
    margin: 9px 0;
}

.author {
    font-size: 15px;
    color: #e5ca72;
    font-weight: bold;
    padding-bottom: 2px;
}

@media (max-width:360px) {
    .card { padding: 13px 11px; }
    .value { font-size: 17px; }
    .label { font-size: 13px; }
    .header-title { font-size: 17px; }
}
</style>
</head>

<body>

<div class="card">

    <div class="header-title">جروب عملاء البنوك المصرية</div>
    <div class="date-str" id="today-date">--</div>

    <div class="update-bar">
        <div class="update-info">
            <span class="status-dot" id="status-dot"></span>
            <span id="last-update">جاري الاتصال...</span>
        </div>

        <button class="refresh-btn" onclick="fetchPrices()">
            تحديث الآن ⟳
        </button>
    </div>

    <div class="grid-container">

        <div class="box">
            <div class="label">عيار 24</div>
            <div class="value" id="gold-24">--</div>
        </div>

        <div class="box">
            <div class="label">عيار 21</div>
            <div class="value" id="gold-21">--</div>
        </div>

        <div class="box">
            <div class="label">عيار 18</div>
            <div class="value" id="gold-18">--</div>
        </div>

        <div class="box">
            <div class="label">عيار 14</div>
            <div class="value" id="gold-14">--</div>
        </div>

    </div>

    <div class="box full-width">
        <div class="label">سعر الجنيه الذهب</div>
        <div class="value" id="gold-coin">--</div>
    </div>

    <div class="box full-width">
        <div class="label">أوقية الذهب</div>
        <div class="value" id="gold-ounce">--</div>
    </div>

    <div class="sub-footer">
        Follow Egyptian Bank Clients Group
    </div>

    <div class="divider"></div>

    <div class="author">إعداد أ/ طارق متولي</div>

</div>

<script>

// التاريخ الحالي للصفحة
function updateDate() {
    const now = new Date();
    const dd = String(now.getDate()).padStart(2,'0');
    const mm = String(now.getMonth()+1).padStart(2,'0');
    const yyyy = now.getFullYear();

    document.getElementById('today-date').innerText =
        `${dd}-${mm}-${yyyy}`;
}

updateDate();

// تنسيق الأسعار بفواصل الآلاف
function formatPrice(value) {
    const cleaned = String(value)
        .replace(/,/g,'')
        .replace(/[^\d.-]/g,'');

    const number = Number(cleaned);

    if (!Number.isFinite(number)) return null;

    return number.toLocaleString('en-US',{
        maximumFractionDigits: 2
    });
}

// قراءة CSV مع دعم علامات الاقتباس
function parseCSV(text) {
    const rows = [];
    let row = [];
    let cell = '';
    let quoted = false;

    for (let i = 0; i < text.length; i++) {
        const ch = text[i];

        if (ch === '"') {
            if (quoted && text[i+1] === '"') {
                cell += '"';
                i++;
            } else {
                quoted = !quoted;
            }
        } else if (ch === ',' && !quoted) {
            row.push(cell.trim());
            cell = '';
        } else if ((ch === '\n' || ch === '\r') && !quoted) {
            if (ch === '\r' && text[i+1] === '\n') i++;
            row.push(cell.trim());
            if (row.some(v => v !== '')) rows.push(row);
            row = [];
            cell = '';
        } else {
            cell += ch;
        }
    }

    row.push(cell.trim());
    if (row.some(v => v !== '')) rows.push(row);

    return rows;
}

let isLoading = false;

async function fetchPrices() {

    if (isLoading) return;
    isLoading = true;

    const status = document.getElementById('last-update');
    const dot = document.getElementById('status-dot');

    try {

        const sheetID =
        '1jGuWDQQgfJmbmIMcG3b--20-IUCEVlFQjbMp0rxv3do';

        const timestamp = Date.now();

        const csvUrl =
        `https://docs.google.com/spreadsheets/d/${sheetID}/export?format=csv&gid=0&t=${timestamp}`;

        const response = await fetch(csvUrl,{
            cache: 'no-store'
        });

        if (!response.ok) {
            throw new Error('فشل الاتصال بالجدول');
        }

        const data = await response.text();

        if (/<html|<!DOCTYPE/i.test(data)) {
            throw new Error('تعذر قراءة بيانات الجدول');
        }

        const rows = parseCSV(data);

        if (rows.length < 6) {
            throw new Error('بيانات الأسعار غير مكتملة');
        }

        const ids = [
            'gold-24',
            'gold-21',
            'gold-18',
            'gold-14',
            'gold-coin',
            'gold-ounce'
        ];

        // قراءة الأسعار والتحقق منها قبل عرضها
        const prices = ids.map((id,index) => {
            if (!rows[index] || rows[index].length < 2) {
                throw new Error('بيانات غير مكتملة');
            }

            const price = formatPrice(rows[index][1]);

            if (price === null) {
                throw new Error('قيمة سعر غير صحيحة');
            }

            return price;
        });

        // وقت آخر تعديل فعلي مسجل في Google Sheets
        // الخلية B7
        const sheetUpdateTime =
            rows[6] && rows[6][1]
                ? rows[6][1].trim()
                : '';

        // عرض الأسعار
        ids.forEach((id,index) => {
            document.getElementById(id).innerHTML =
                `${prices[index]} <span class="currency">جنيه</span>`;
        });

        // عرض وقت تعديل الجدول فقط، وليس وقت الفحص
        if (sheetUpdateTime) {
            status.innerText =
                `آخر تحديث للأسعار: ${sheetUpdateTime}`;
        } else {
            status.innerText =
                'وقت تعديل الأسعار غير مسجل';
        }

        dot.className = 'status-dot online';

    } catch (error) {

        console.error('خطأ في تحديث الأسعار:',error);

        status.innerText = 'تعذر الاتصال بالجدول';
        dot.className = 'status-dot offline';

    } finally {
        isLoading = false;
    }
}

// قراءة البيانات عند فتح الصفحة
fetchPrices();

// فحص Google Sheets كل دقيقة
// الفحص لا يغير وقت آخر تحديث المعروض
setInterval(fetchPrices,60000);

</script>

</body>
</html>
